[project]
name = "recut"
version = "0.1.0"
description = "Decompose short-form video edits into a machine-readable recipe and re-render with different footage."
requires-python = ">=3.11"
readme = "RECUT_SPEC.md"

# Pinned per BUILD_ORDER.md/INSTRUCTIONS.md Unit 0.1. Exact pins (not ranges)
# because yt-dlp, PySceneDetect, and VLM SDKs are exactly the moving parts
# the spec flags as fragile (sec 8.2/8.4) - a regression must be bisectable
# to a specific dependency bump. Do not add a dependency to this list
# without also adding it to eval/run.py's regression-gate awareness (a
# dependency bump is a reason to re-run the golden set).
#
# Phase 2+ deps (Remotion/Node, CLIP, Demucs, PaddleOCR/OCR extra pin
# excepted below since Phase 1 needs it) are intentionally deferred - pin
# them when the phase that first uses them starts, not now.
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "celery==5.6.3",
    "redis==5.3.1",
    "opencv-python==4.11.0.86",  # NOT 5.0.0.93 - too new/unproven for scenedetect/ORB compat; revisit once 5.x is verified against scenedetect
    "scenedetect==0.7.1",
    "librosa==0.11.0",
    "scipy==1.17.1",  # matcher/assign.py (Unit 3.8) imports scipy.optimize.linear_sum_assignment directly -
                      # was only a transitive librosa dependency before; pinned explicitly since it's now a
                      # direct import, not just incidentally available.
    "faster-whisper==1.2.1",
    "yt-dlp==2026.7.4",
    "numpy==1.26.4",  # pinned <2.0: opencv-python 4.11 wheels + scenedetect are built/tested against numpy 1.x
    "python-multipart==0.0.32",
    "structlog==26.1.0",
    "Pillow==12.3.0",  # semantics/evidence_pack.py (Unit 3.2): contact-sheet tiling + timestamp burn-in
]

[project.optional-dependencies]
dev = [
    "pytest", "pytest-cov", "ruff", "mypy",
    "fakeredis==2.37.0",  # tests/api/ - real redis-py wire protocol against memory, no server needed
    "httpx==0.28.1",  # tests/api/test_main.py's FastAPI TestClient needs this explicitly - was only
                      # present transitively (via the `semantics` extra's anthropic SDK) before, which
                      # would silently break a dev+test install that skips that extra.
]
ocr = [
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",  # NOT 3.x - paddleocr 2.9.1 targets paddle 2.x; 3.x's oneDNN backend
                            # changes broke inference with "OneDnnContext does not have the input Filter"
]
semantics = [
    "anthropic==0.120.2",  # Unit 3.3 - primary L2 provider, see semantics/providers/anthropic_provider.py.
                           # Model id pinned in code (AnthropicProvider.model_id), verified live against
                           # platform.claude.com/docs/en/about-claude/models/overview.md, NOT hand-guessed.
]
local-vlm = []  # fill in when semantics/providers/local_provider.py is implemented
audio-sep = ["demucs==4.1.0"]  # pulled in only where signals/audio.py::separate_speech_music is used - heavy (torch)
matcher = [
    "open_clip_torch==3.3.0",  # Unit 3.6 - matcher/probe.py CLIP embedding (ViT-B-32/openai weights,
                               # downloaded on first use). torch itself already comes in via the
                               # audio-sep (demucs) extra; not re-pinned here to avoid two conflicting pins.
]
mcp-server = [
    # Unit 4.6 - recut_mcp/server.py's stdio transport. NAMING NOTE: this
    # project's own L6 package was originally named `mcp/` (matching
    # INSTRUCTIONS.md's literal file paths), which collides with this
    # exact PyPI package name - `import mcp` inside the project would
    # always resolve to the LOCAL package, never this one, no matter the
    # install order. Renamed the local package to recut_mcp/ (Unit 4.6)
    # rather than working around the collision some other way - see
    # DESIGN_NOTES.md.
    "mcp==2.0.0",
]
golden-import = [
    "opentimelineio==0.18.1",  # core ships ONLY otio_json/otioz/otiod - fcp_xml/fcpx_xml/AAF are
                               # separate plugin packages below, NOT an "opentimelineio-contrib"
                               # package (that package does not exist on PyPI - verified directly;
                               # the original plan assumed it did and was wrong). Each of the three
                               # packages below self-registers its adapter into
                               # otio.adapters.available_adapter_names() on import via OTIO's plugin
                               # manifest mechanism - no explicit registration code needed.
    "otio-fcp-adapter==1.0.0",  # legacy FCP7/xmeml XML - this is what Premiere Pro's own
                                # "Export > Final Cut Pro XML" actually produces. Mature, reliable.
    "otio-fcpx-xml-adapter==1.0.0",  # modern Apple FCPXML (.fcpxml) - community-maintained,
                                     # treat as best-effort, not equal-reliability to otio-fcp-adapter.
    "otio-aaf-adapter==2.0.0",  # optional AAF (.aaf) support - not required for Unit 0.4's done criteria.
]
# golden-import is eval/dev-tooling ONLY (eval/golden/import_project_file.py, Unit 0.4) - it must
# never be imported by signals/, compiler/, or anything on the production analysis/render path.
# See DESIGN_NOTES.md sec 16 and INSTRUCTIONS.md Unit 0.4.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that download models / run real ML inference (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit include list - flat-layout auto-discovery picks up skills/
# (the two cloned reference repos under skills/, not RECUT source) and
# would try to package them too. See DESIGN_NOTES.md repo layout.
include = [
    "api*", "cli*", "common*", "compiler*", "eval*", "ingest*",
    "matcher*", "recut_mcp*", "render*", "schemas*", "semantics*", "signals*",
]
