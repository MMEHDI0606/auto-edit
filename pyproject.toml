[project]
name = "recut"
version = "0.1.0"
description = "Decompose short-form video edits into a machine-readable recipe and re-render with different footage."
requires-python = ">=3.11"
readme = "RECUT_SPEC.md"

# Pinned per BUILD_ORDER.md/INSTRUCTIONS.md Unit 0.1. Exact pins (not ranges)
# because yt-dlp, PySceneDetect, and VLM SDKs are exactly the moving parts
# the spec flags as fragile (sec 8.2/8.4) - a regression must be bisectable
# to a specific dependency bump. Do not add a dependency to this list
# without also adding it to eval/run.py's regression-gate awareness (a
# dependency bump is a reason to re-run the golden set).
#
# Phase 2+ deps (Remotion/Node, CLIP, Demucs, PaddleOCR/OCR extra pin
# excepted below since Phase 1 needs it) are intentionally deferred - pin
# them when the phase that first uses them starts, not now.
dependencies = [
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "fastapi==0.141.1",
    "uvicorn==0.52.1",
    "celery==5.6.3",
    "redis==5.3.1",
    "opencv-python==4.11.0.86",  # NOT 5.0.0.93 - too new/unproven for scenedetect/ORB compat; revisit once 5.x is verified against scenedetect
    "scenedetect==0.7.1",
    "librosa==0.11.0",
    "faster-whisper==1.2.1",
    "yt-dlp==2026.7.4",
    "numpy==1.26.4",  # pinned <2.0: opencv-python 4.11 wheels + scenedetect are built/tested against numpy 1.x
    "python-multipart==0.0.32",
    "structlog==26.1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy"]
ocr = [
    "paddleocr==2.9.1",
    "paddlepaddle==2.6.2",  # NOT 3.x - paddleocr 2.9.1 targets paddle 2.x; 3.x's oneDNN backend
                            # changes broke inference with "OneDnnContext does not have the input Filter"
]
local-vlm = []  # fill in when semantics/providers/local_provider.py is implemented
audio-sep = ["demucs==4.1.0"]  # pulled in only where signals/audio.py::separate_speech_music is used - heavy (torch)
golden-import = [
    "opentimelineio==0.17.0",  # VERIFY against latest PyPI release at Unit 0.4 implementation time -
                               # this pin predates that unit's build. Core adapters used: otio_json
                               # (native .otio) and fcp_xml (legacy FCP7/xmeml XML - this is what
                               # Premiere Pro's "Export > Final Cut Pro XML" actually produces).
    "opentimelineio-contrib==0.17.0",  # separate package, NOT bundled in core opentimelineio - needed
                                       # for fcpx_xml (modern Apple FCPXML, .fcpxml) and the optional
                                       # AAF adapter. Less consistently maintained than core; treat
                                       # .fcpxml import as best-effort, not equal-reliability to fcp_xml.
]
# golden-import is eval/dev-tooling ONLY (eval/golden/import_project_file.py, Unit 0.4) - it must
# never be imported by signals/, compiler/, or anything on the production analysis/render path.
# See DESIGN_NOTES.md sec 16 and INSTRUCTIONS.md Unit 0.4.

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that download models / run real ML inference (deselect with -m 'not slow')"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# Explicit include list - flat-layout auto-discovery picks up skills/
# (the two cloned reference repos under skills/, not RECUT source) and
# would try to package them too. See DESIGN_NOTES.md repo layout.
include = [
    "api*", "cli*", "common*", "compiler*", "eval*", "ingest*",
    "matcher*", "mcp*", "render*", "schemas*", "semantics*", "signals*",
]
